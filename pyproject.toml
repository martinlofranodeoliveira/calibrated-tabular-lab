[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrated-tabular-lab"
version = "0.1.0"
description = "Bounded offline tabular calibration experiment core"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/licenses/**/*"]
authors = [{name = "Lofrano Tecnologia"}]
dependencies = ["numpy==2.5.4", "scikit-learn==1.9.1", "threadpoolctl==3.8.0"]

[project.scripts]
calibrated-tabular-lab = "calibrated_tabular_lab.cli:main"

[project.urls]
Homepage = "https://lofranotecnologia.com.br"
Repository = "https://github.com/martinlofranodeoliveira/calibrated-tabular-lab"

[tool.setuptools.packages.find]
where = ["src"]
